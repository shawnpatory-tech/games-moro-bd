
name: Deploy GAMES MORO BD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract App Source
        run: |
          mkdir -p /tmp/games-source
          unzip -q games-moro-bd-pwa-source.zip -d /tmp/games-source
          PROJECT_DIR=$(dirname "$(find /tmp/games-source -name package.json -print -quit)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found in ZIP"
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .

      - name: Install Dependencies
        run: npm install

      - name: Build App
        run: npm run build -- --base=/games-moro-bd/

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
